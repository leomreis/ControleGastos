services:
  - type: web
    name: controlegastos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false # colar a connection string do Neon no painel
      - key: ControleGastos_CORS
        value: https://controlegastos-web.onrender.com

  - type: web
    name: controlegastos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://controlegastos-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
